<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>2.5D Parallax</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
  }
  #container {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas#c {
    position: absolute;
    display: block;
  }
  #frame-overlay {
    position: absolute;
    pointer-events: none;
    z-index: 10;
  }
  #hint {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 20;
    transition: opacity 1.2s;
    font-family: Georgia, serif;
    white-space: nowrap;
  }
  #hint.hidden { opacity: 0; }
  #gyro-btn {
    position: fixed;
    bottom: 56px; left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.85);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px;
    padding: 10px 26px;
    font-size: 13px;
    letter-spacing: 0.1em;
    font-family: Georgia, serif;
    cursor: pointer;
    z-index: 30;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: opacity 0.6s, background 0.2s;
    white-space: nowrap;
  }
  #gyro-btn:active { background: rgba(255,255,255,0.28); }
  #gyro-btn.hidden { opacity: 0; pointer-events: none; }
  #loading {
    position: fixed; inset: 0;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.4);
    font-family: Georgia, serif;
    font-size: 13px;
    letter-spacing: 0.2em;
    z-index: 50;
    transition: opacity 0.8s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="loading">LOADING ...</div>
<div id="container">
  <canvas id="c"></canvas>
  <img id="frame-overlay" src="./frame.png" />
</div>
<div id="hint">터치하여 움직여보세요 · Move your mouse</div>
<button id="gyro-btn">📐 기울여서 조작하기</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const IMG_W = 364, IMG_H = 909;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: false,
  alpha: false,
  powerPreference: 'default',
  preserveDrawingBuffer: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene  = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 10);
camera.position.z = 1;

let mesh = null;

function loadTexture(url) {
  return new Promise((resolve, reject) => {
    const loader = new THREE.TextureLoader();
    loader.load(
      url,
      tex => {
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
        tex.generateMipmaps = false;
        resolve(tex);
      },
      undefined,
      err => reject(err)
    );
  });
}

Promise.all([
  loadTexture('./main.png'),
  loadTexture('./depth.png')
]).then(([mainTex, depthTex]) => {

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTex:      { value: mainTex  },
      uDepth:    { value: depthTex },
      uMouse:    { value: new THREE.Vector2(0.5, 0.5) },
      uStrength: { value: 0.05 } // 0.1에서 0.05로 시차 강도 감소
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      precision mediump float;
      uniform sampler2D uTex;
      uniform sampler2D uDepth;
      uniform vec2 uMouse;
      uniform float uStrength;
      varying vec2 vUv;
      void main() {
        vec2 mouse = uMouse - 0.5;
        float d = texture2D(uDepth, vUv).r;
        vec2 offset   = mouse * uStrength * d;
        vec2 bgOffset = mouse * uStrength * 0.3 * (1.0 - d) * -1.0;
        vec2 uv = clamp(vUv - offset - bgOffset, 0.001, 0.999);
        gl_FragColor = texture2D(uTex, uv);
      }
    `
  });

  function resize() {
    const W = window.innerWidth, H = window.innerHeight;
    renderer.setSize(W, H);
    const imgRatio = IMG_W / IMG_H, winRatio = W / H;
    let pxW, pxH, planeW, planeH;
    if (winRatio > imgRatio) {
      pxH = H; pxW = H * imgRatio;
      planeH = 2; planeW = 2 * imgRatio / winRatio;
    } else {
      pxW = W; pxH = W / imgRatio;
      planeW = 2; planeH = 2 * winRatio / imgRatio;
    }
    document.getElementById('frame-overlay').style.width  = pxW + 'px';
    document.getElementById('frame-overlay').style.height = pxH + 'px';
    if (mesh) scene.remove(mesh);
    mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(planeW, planeH, 128, 128),
      mat
    );
    scene.add(mesh);
  }
  resize();
  window.addEventListener('resize', resize);

  const loading = document.getElementById('loading');
  loading.classList.add('hidden');
  setTimeout(() => loading.style.display = 'none', 900);

  const target  = new THREE.Vector2(0.5, 0.5);
  const current = new THREE.Vector2(0.5, 0.5);
  const hint    = document.getElementById('hint');

  window.addEventListener('mousemove', e => {
    target.set(e.clientX / window.innerWidth, 1 - e.clientY / window.innerHeight);
    hint.classList.add('hidden');
  });

  let lastTouch = null;
  window.addEventListener('touchstart', e => {
    lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    if (lastTouch) {
      // 터치 감도를 낮춤 (32.0 -> 8.0 / 16.0 -> 4.0)
      const dx = (t.clientX - lastTouch.x) / window.innerWidth  * 8.0; 
      const dy = (t.clientY - lastTouch.y) / window.innerHeight * 4.0;
      target.set(
        THREE.MathUtils.clamp(target.x + dx, 0, 1),
        THREE.MathUtils.clamp(target.y - dy, 0, 1)
      );
    }
    lastTouch = { x: t.clientX, y: t.clientY };
    hint.classList.add('hidden');
  }, { passive: false });

  const gyroBtn = document.getElementById('gyro-btn');

  function onGyro(e) {
    if (e.gamma == null) return;
    // 자이로 감도를 낮춤 (분모를 키워 각도 범위를 확장: 5 -> 20 / 7.5 -> 30)
    target.set(
      THREE.MathUtils.clamp((e.gamma + 10) / 20, 0, 1),   
      THREE.MathUtils.clamp((e.beta  + 15) / 30, 0, 1) 
    );
    hint.classList.add('hidden');
  }

  function enableGyro() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(state => {
          if (state === 'granted') {
            window.addEventListener('deviceorientation', onGyro);
            gyroBtn.textContent = '✅ 기울기 활성화됨';
            setTimeout(() => gyroBtn.classList.add('hidden'), 1500);
          }
        });
    } else {
      window.addEventListener('deviceorientation', onGyro);
      gyroBtn.classList.add('hidden');
    }
  }

  gyroBtn.addEventListener('click', enableGyro);

  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission !== 'function') {
    window.addEventListener('deviceorientation', onGyro);
    gyroBtn.classList.add('hidden');
  }

  (function tick() {
    requestAnimationFrame(tick);
    // lerp 수치를 0.06에서 0.04로 낮춰 더 묵직하고 부드럽게 따라오도록 수정
    current.lerp(target, 0.04); 
    mat.uniforms.uMouse.value.copy(current);
    renderer.render(scene, camera);
  })();

}).catch(err => {
  console.error('Load error:', err);
});
</script>
</body>
</html>
